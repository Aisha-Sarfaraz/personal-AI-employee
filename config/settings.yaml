vault:
  root: "vault"
  folders:
    inbox: "Inbox"
    needs_action: "Needs_Action"
    plans: "Plans"
    done: "Done"
    logs: "Logs"
    pending_approval: "Pending_Approval"
    approved: "Approved"
    rejected: "Rejected"
    watch: "Watch"
  state_dir: "state"

watchers:
  filesystem:
    enabled: true
    watch_folder: "vault/Watch"
    poll_interval: 5
    stability_wait: 2
  gmail:
    enabled: false
  whatsapp:
    enabled: false
  finance:
    enabled: false

orchestrator:
  scan_interval: 30
  max_plan_age_hours: 48

approval:
  expiry_hours: 24
  check_interval: 10

dev_mode: true

logging:
  level: "INFO"
  audit_format: "markdown"
