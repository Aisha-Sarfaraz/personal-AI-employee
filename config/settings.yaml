vault:
  root: "vault"
  folders:
    inbox: "Inbox"
    needs_action: "Needs_Action"
    plans: "Plans"
    done: "Done"
    logs: "Logs"
    pending_approval: "Pending_Approval"
    approved: "Approved"
    rejected: "Rejected"
    watch: "Watch"
  state_dir: "state"

watchers:
  filesystem:
    enabled: true
    watch_folder: "vault/Watch"
    poll_interval: 5
    stability_wait: 2
  gmail:
    enabled: false
    poll_interval: 120
    mock_folder: "vault/Watch/gmail_mock"
    max_results: 10
  whatsapp:
    enabled: false               # set true after running setup_session()
    poll_interval: 120
    session_path: "vault/state/whatsapp_session"
    mock_folder: "vault/Watch/whatsapp_mock"
    keywords:
      - "urgent"
      - "asap"
      - "invoice"
      - "payment"
      - "help"
      - "quote"
      - "price"
      - "pricing"
      - "interested"
      - "contract"
  linkedin:
    enabled: false
    poll_interval: 3600
    session_path: "vault/state/linkedin_session"
    mock_folder: "vault/Watch/linkedin_mock"
    username: ""
  finance:
    enabled: false

orchestrator:
  scan_interval: 120
  max_plan_age_hours: 48

approval:
  expiry_hours: 48
  check_interval: 10

dev_mode: true

skills:
  detect_lead:
    enabled: true
    keywords:
      - "interested"
      - "pricing"
      - "quote"
      - "proposal"
      - "demo"
      - "trial"
      - "buy"
      - "purchase"
      - "contract"
      - "invoice"
  generate_linkedin_post:
    enabled: true
    frequency_days: 3
  generate_plan:
    enabled: true
  weekly_briefing:
    enabled: true

rate_limits:
  send_email: 20
  post_social: 5
  create_invoice: 10
  default: 20

idempotency:
  ttl_hours: 24
  state_file: "vault/state/idempotency.json"

logging:
  level: "INFO"
  audit_format: "markdown"
