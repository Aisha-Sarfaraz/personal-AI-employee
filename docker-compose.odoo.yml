version: "3.8"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fte_db
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    networks:
      - odoo_net
    restart: unless-stopped

  odoo:
    image: odoo:19.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - odoo_data:/var/lib/odoo
      - ./config/odoo/odoo.conf:/etc/odoo/odoo.conf:ro
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    networks:
      - odoo_net
    restart: unless-stopped

volumes:
  odoo_db_data:
  odoo_data:

networks:
  odoo_net:
    driver: bridge
